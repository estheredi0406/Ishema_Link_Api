services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ishemalink_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      - POSTGRES_DB=ishemalink
      - POSTGRES_USER=ishema
      - POSTGRES_PASSWORD=ishema_secure_pass_2026
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ishema -d ishemalink"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ishemalink_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: ishemalink_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ishemalink_network

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ishemalink_web
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 ishemalink.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=ishemalink.settings
      - DATABASE_URL=postgresql://ishema:ishema_secure_pass_2026@db:5432/ishemalink
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1,ishemalink.rw
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ishemalink_network

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ishemalink_celery
    command: celery -A ishemalink worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - logs_volume:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=ishemalink.settings
      - DATABASE_URL=postgresql://ishema:ishema_secure_pass_2026@db:5432/ishemalink
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - ishemalink_network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ishemalink_celery_beat
    command: celery -A ishemalink beat --loglevel=info
    volumes:
      - .:/app
      - logs_volume:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=ishemalink.settings
      - DATABASE_URL=postgresql://ishema:ishema_secure_pass_2026@db:5432/ishemalink
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - ishemalink_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ishemalink_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - ishemalink_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local

networks:
  ishemalink_network:
    driver: bridge